name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:run

      - name: Build
        env:
          # Pull requests run this repository's scripts from the pull
          # request. Real client keys are passed only on a push to main.
          VITE_SUPABASE_URL: ${{ github.event_name == 'push' && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ github.event_name == 'push' && secrets.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_GEMINI_API_KEY: ${{ github.event_name == 'push' && secrets.VITE_GEMINI_API_KEY || '' }}
        run: |
          # Empty values stay empty until the secrets are re-entered in Depot.
          # Placeholders keep this CI build green. They are not a deploy.
          export VITE_SUPABASE_URL="${VITE_SUPABASE_URL:-https://placeholder.supabase.co}"
          export VITE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-placeholder-anon-key}"
          export VITE_GEMINI_API_KEY="${VITE_GEMINI_API_KEY:-placeholder-gemini-key}"
          npm run build

  ai-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin the Origin CLI
        run: |
          # The review script executes a fixed absolute path. Copy a
          # runner-provided binary there when it is not already in one
          # of those locations. A missing CLI is not a failed job.
          if [ -x /usr/local/bin/origin ] || [ -x /usr/bin/origin ] || [ -x /root/.local/bin/origin ] || [ -x /home/runner/.local/bin/origin ] || [ -x /github/home/.local/bin/origin ]; then
            exit 0
          fi
          src="$(command -v origin || true)"
          if [ -z "$src" ]; then
            echo "origin CLI is not installed"
            exit 0
          fi
          for dest in /usr/local/bin/origin /root/.local/bin/origin /home/runner/.local/bin/origin /github/home/.local/bin/origin; do
            dir="$(dirname "$dest")"
            if mkdir -p "$dir" 2>/dev/null && ln -sfn "$src" "$dest" 2>/dev/null; then
              exit 0
            fi
          done
          echo "origin CLI could not be pinned to a fixed path"

      - name: Grok review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The secret is only visible to this step. Execute the script
          # stored on the base branch, not the copy from the pull request.
          # Skip until that file exists rather than running untrusted code.
          base="${GITHUB_BASE_REF:-main}"
          case "$base" in
            *[!A-Za-z0-9._/-]*|*..*)
              echo "AI review failed: base ref is not a branch name"
              exit 1
              ;;
          esac
          if ! git cat-file -e "origin/${base}:scripts/ai-review.mjs" 2>/dev/null; then
            echo "AI review skipped: scripts/ai-review.mjs is not on origin/${base} yet"
            exit 0
          fi
          dest="${RUNNER_TEMP:-/tmp}/ai-review.mjs"
          git show "origin/${base}:scripts/ai-review.mjs" > "$dest"
          node "$dest"
