# .github/workflows/pr-preview.yml

name: PR Preview & Smoke Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-preview:
    name: Deploy Preview to GitHub Pages
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  playwright-smoke:
    name: Playwright Smoke Test
    needs: deploy-preview
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.44.0-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Playwright verification
        run: python3 verify.py ${{ needs.deploy-preview.outputs.page_url }}

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            verification_success.png
            verification_error.png
          if-no-files-found: ignore