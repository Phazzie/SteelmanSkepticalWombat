<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wombat-ish silhouette icon in lime on dark background -->
  <rect width="100" height="100" rx="20" fill="#1F2937"/>
  <!-- Body -->
  <ellipse cx="50" cy="62" rx="28" ry="20" fill="#A3E635"/>
  <!-- Head -->
  <ellipse cx="50" cy="38" rx="18" ry="16" fill="#A3E635"/>
  <!-- Ears -->
  <ellipse cx="36" cy="26" rx="7" ry="9" fill="#A3E635"/>
  <ellipse cx="64" cy="26" rx="7" ry="9" fill="#A3E635"/>
  <!-- Eyes -->
  <circle cx="44" cy="36" r="3" fill="#1F2937"/>
  <circle cx="56" cy="36" r="3" fill="#1F2937"/>
  <!-- Nose -->
  <ellipse cx="50" cy="44" rx="4" ry="3" fill="#1F2937"/>
  <!-- Skeptical brow lines -->
  <line x1="40" y1="30" x2="48" y2="33" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="30" x2="52" y2="33" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
</svg>
